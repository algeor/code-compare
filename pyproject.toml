[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pr-suggestion-metrics"
version = "0.1.0"
description = "Research tooling for measuring semantic coverage of code-review suggestions in merged pull requests."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
structural = [
    "code-diff>=0.1.3,<0.2",
    "pygments>=2.18,<3",
    "tree-sitter-language-pack>=1.0,<2",
]
train = [
    "catboost>=1.2,<2",
    "lightgbm>=4.5,<5",
    "xgboost>=3,<4",
]
embeddings = [
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.49,<6",
]
collection = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "sqlalchemy-hana>=4.6,<5",
]
notebooks = [
    "datasets>=3.3,<6",
    "ipykernel>=6.29,<8",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<0.14",
]
test = ["pytest>=8.3,<10"]
lint = ["ruff>=0.9,<1"]
typecheck = [
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<4",
]
dev = [
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<4",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
pr-suggestion-audit-labels = "pr_suggestion_metrics.audit_semantic_labels:main"
pr-suggestion-build-dataset = "pr_suggestion_metrics.build_dataset:main"
pr-suggestion-calibrate-uncertainty = "pr_suggestion_metrics.uncertainty:main"
pr-suggestion-collect = "pr_suggestion_metrics.collect_pr_code_changes:main"
pr-suggestion-evaluate = "pr_suggestion_metrics.evaluate_metrics:main"
pr-suggestion-evaluate-frozen = "pr_suggestion_metrics.evaluate_frozen_benchmark:main"
pr-suggestion-freeze-benchmark = "pr_suggestion_metrics.freeze_benchmark:main"
pr-suggestion-label-batches = "pr_suggestion_metrics.semantic_labeling_batches:main"
pr-suggestion-prepare-annotations = "pr_suggestion_metrics.prepare_annotation_packets:main"
pr-suggestion-prepare-parsers = "pr_suggestion_metrics.prepare_structural_parsers:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_suggestion_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
mypy_path = "src"
packages = ["pr_suggestion_metrics"]
ignore_missing_imports = true
